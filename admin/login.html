<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Connexion</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="../images/logo.png" alt="NOMAD Logo" class="login-logo">
            <h1>NOMAD Admin</h1>
            <a href="/index.html" class="retour">Retour au site</a>

            <div id="login-error" class="login-error"></div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="login-btn">Se connecter</button>
            </form>

            <!-- <div style="margin-top: 30px; padding: 15px; background: #f0f0f0; border-radius: 6px; font-size: 0.9rem;">
                <p style="margin: 0; color: #666;"><strong>Identifiants de démo:</strong></p>

                <p style="margin: 5px 0; color: #666;">Mot de passe: <code>nomad2026</code></p>
            </div> -->
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
